global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "ingest-tier"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8080"
          - "ingest-1:8080"
          - "ingest-2:8080"
          - "ingest-3:8080"

  - job_name: "dispatch-tier"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:9092"
          - "dispatcher:9092"

  - job_name: "worker-tier"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:9091"
          - "ledger-worker:9091"
          - "notifier-worker:9091"
          - "analytics-worker:9091"
